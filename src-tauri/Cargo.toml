[package]
name = "dsh-tauri-gui"
version = "0.1.1"
description = "DeepSeek Harness Tauri Desktop - zero-dependency Tauri wrapper"
authors = ["KevinT-hub"]
license = "MIT"
edition = "2021"

[lib]
name = "dsh_tauri_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "6"
chrono = "0.4"
tar = "0.4"
flate2 = "1"
url = "2"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.2"
