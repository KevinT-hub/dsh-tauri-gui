name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.2.3 or v1.2.3-rc.1. Must already exist and point at source_ref.'
        required: true
      source_ref:
        description: 'Git ref (branch name or commit SHA) the release builds from. Must match the tag commit.'
        required: false
        default: 'main'
      publish_mode:
        description: 'draft keeps the release hidden; prerelease/stable publish immediately. stable requires production-release environment approval.'
        required: false
        default: 'draft'
        type: choice
        options:
          - draft
          - prerelease
          - stable

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # GitHub-hosted runners run outside mainland China. Use upstream sources
  # for npm packages; the shell never bundles a Node runtime, so no Node
  # archive mirror is needed here.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. resolve-release: strict SemVer parse, version-file consistency,
  #    tag commit / source branch validation, existing-release check.
  # ---------------------------------------------------------------------
  resolve-release:
    name: Resolve and validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      # source_sha is emitted by Validate tag commit and source branch, not by
      # the version parser. Keeping this mapping explicit ensures every later
      # job checks out the exact commit behind the pushed tag.
      source_sha: ${{ steps.validate_tag.outputs.source_sha }}
      release_exists: ${{ steps.check_existing.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.source_ref }}

      - name: Resolve tag and version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires inputs.tag (e.g. v1.2.3)"
              exit 1
            fi
          fi
          node scripts/release-version.mjs parse "$TAG" --output "$GITHUB_OUTPUT"

      - name: Verify version files agree
        run: |
          set -euo pipefail
          node scripts/release-version.mjs check-files \
            --version "${{ steps.resolve.outputs.version }}"

      - name: Validate publish_mode vs channel
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          MODE="${{ inputs.publish_mode }}"
          IS_PRERELEASE="${{ steps.resolve.outputs.is_prerelease }}"
          if [ "$MODE" = "stable" ] && [ "$IS_PRERELEASE" = "true" ]; then
            echo "::error::publish_mode=stable requires a stable tag (no prerelease)"
            exit 1
          fi
          if [ "$MODE" = "prerelease" ] && [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::publish_mode=prerelease requires a prerelease tag"
            exit 1
          fi

      - name: Validate tag commit and source branch
        id: validate_tag
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          PRERELEASE="${{ steps.resolve.outputs.is_prerelease }}"
          git fetch --tags --prune --force origin "+refs/heads/*:refs/remotes/origin/*"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG" 2>/dev/null || {
            echo "::error::tag ${TAG} not found; push it first"
            exit 1
          })
          echo "source_sha=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SOURCE_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$SOURCE_COMMIT" ]; then
              echo "::error::tag ${TAG} points to ${TAG_COMMIT} but checked-out source_ref points to ${SOURCE_COMMIT}; pass the ref the tag points at"
              exit 1
            fi
          fi

          IS_ANCESTOR=0
          if git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            IS_ANCESTOR=1
          elif [ "$PRERELEASE" = "true" ]; then
            for r in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release/*'); do
              if git merge-base --is-ancestor "$TAG_COMMIT" "$r"; then
                IS_ANCESTOR=1
                break
              fi
            done
          fi
          if [ "$IS_ANCESTOR" = "0" ]; then
            echo "::error::tag ${TAG} is not an ancestor of origin/main$([ "$PRERELEASE" = "true" ] && echo ' or origin/release/*')"
            exit 1
          fi
          echo "::notice::tag ${TAG} (${TAG_COMMIT}) validated"

      - name: Check for existing release
        id: check_existing
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          if RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/tmp/release_query.err); then
            RELEASE_TAG=$(jq -r '.tag_name // empty' <<<"$RELEASE_JSON")
            if [ "$RELEASE_TAG" != "$TAG" ]; then
              echo "::error::release lookup returned tag ${RELEASE_TAG:-<empty>}, expected ${TAG}"
              exit 1
            fi
            # targetCommitish is release metadata, not the commit resolved by
            # the Git tag. GitHub commonly stores "main" here even when the
            # tag itself points at a specific commit SHA. The tag commit was
            # already validated in the previous step.
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release ${TAG} already exists; reusing it"
          elif grep -Eqi "not found|404" /tmp/release_query.err; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::failed to query release ${TAG}: $(cat /tmp/release_query.err)"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # 2. prepare-release: create (or read) the draft release, record release_id.
  #    Stable releases go through the `production-release` environment so
  #    required reviewers can gate them; prereleases use a permissive env.
  # ---------------------------------------------------------------------
  prepare-release:
    name: Prepare draft release
    needs: [resolve-release]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-release.outputs.is_prerelease == 'false' && 'production-release' || 'prerelease-release' }}
    outputs:
      release_id: ${{ steps.ensure_draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Ensure draft release exists
        id: ensure_draft
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          PRERELEASE="${{ needs.resolve-release.outputs.is_prerelease }}"
          SHA="${{ needs.resolve-release.outputs.source_sha }}"
          NOTES_ARGS=()
          if [ -f "RELEASE_NOTES_${TAG}.md" ]; then
            NOTES_ARGS=(--notes-file "RELEASE_NOTES_${TAG}.md")
          elif [ -f "RELEASE_NOTES.md" ] && grep -q "${TAG}" RELEASE_NOTES.md; then
            NOTES_ARGS=(--notes-file RELEASE_NOTES.md)
          fi
          node scripts/reconcile-release-state.mjs ensure-draft \
            --tag "$TAG" --prerelease "$PRERELEASE" --target "$SHA" \
            "${NOTES_ARGS[@]}" --output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 3. build: platform matrix. Every platform builds the exact tag commit
  #    with the pinned Rust toolchain and produces a bundle-manifest.json.
  #    No runtime is bundled: the installer ships the shell only, and the
  #    setup screen detects the user's external Node/npm/pnpm/dsh.
  # ---------------------------------------------------------------------
  build:
    name: Build ${{ matrix.artifact }}
    needs: [resolve-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            bundle_platform: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: darwin-aarch64
            bundle_platform: macos
            bundle_arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: darwin-x86_64
            bundle_platform: macos
            bundle_arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            bundle_platform: linux
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Rust channel comes from src-tauri/rust-toolchain.toml (pinned).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Validate updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
          [[ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"; exit 1; }
          echo "Updater signing secrets are present; Tauri will validate the key and password during signing."

      # Reverse assertion: the installer must NOT carry any runtime resources
      # (no bundled Node, no runtime archives, no runtime manifests).
      - name: Assert no runtime resources are declared
        shell: bash
        run: |
          set -euo pipefail
          # resources/ must not contain any runtime payload.
          if [ -d src-tauri/resources ] && find src-tauri/resources -type f | grep -qiE 'runtime|node|pnpm|dsh'; then
            echo "::error::src-tauri/resources contains runtime payload"
            find src-tauri/resources -type f
            exit 1
          fi
          # tauri.conf.json must not declare runtime resources.
          RESOURCES=$(node -e "const c=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); console.log((c.bundle.resources||[]).join(' '))")
          if echo "$RESOURCES" | grep -qiE 'runtime|node|pnpm|dsh'; then
            echo "::error::tauri.conf.json declares runtime resources: $RESOURCES"
            exit 1
          fi
          echo "No runtime resources declared in source or config."

      - name: Build Tauri bundles (with updater signatures)
        run: pnpm exec tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename bundles to release naming convention
        shell: bash
        run: |
          node scripts/rename-bundles.mjs \
            --dir "src-tauri/target/${{ matrix.target }}/release/bundle" \
            --version "${{ needs.resolve-release.outputs.version }}" \
            --platform "${{ matrix.bundle_platform }}" \
            --arch "${{ matrix.bundle_arch }}" \
            --target "${{ matrix.target }}"

      - name: Sign macOS DMG
        if: matrix.bundle_platform == 'macos'
        run: pnpm exec tauri signer sign "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/dsh-tauri-gui_${{ needs.resolve-release.outputs.version }}_macOS_${{ matrix.bundle_arch }}.dmg"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify bundle manifest (files, signatures, version, digests)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          MANIFEST="$BUNDLE/bundle-manifest.json"
          [ -f "$MANIFEST" ] || { echo "::error::missing $MANIFEST"; exit 1; }
          node -e "
            const fs = require('fs');
            const path = require('path');
            const m = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const expected = process.argv[2];
            if (m.version !== expected) {
              throw new Error('manifest version ' + m.version + ' != expected ' + expected);
            }
            if (m.files.length === 0) throw new Error('empty manifest');
            for (const f of m.files) {
              const p = path.join(path.dirname(process.argv[1]), f.artifact);
              if (!fs.existsSync(p)) throw new Error('missing artifact ' + f.artifact);
              if (!fs.existsSync(path.join(path.dirname(process.argv[1]), f.signature))) {
                throw new Error('missing signature ' + f.signature);
              }
              if (!/^[0-9a-f]{64}$/.test(f.sha256)) throw new Error('bad sha256 for ' + f.artifact);
            }
            console.log('manifest OK: ' + m.files.length + ' artifact(s) for v' + m.version);
          " "$MANIFEST" "${{ needs.resolve-release.outputs.version }}"

      - name: Assert bundles contain no runtime payload
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          LEAKS=$(find "$BUNDLE" -type f \( -name 'runtime.tar.gz' -o -name 'runtime.json' -o -name 'node.exe' -o -path '*/runtime/*' -o -name 'dsh.cmd' -o -name 'pnpm*' \) 2>/dev/null || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::runtime payload leaked into the bundle:"
            echo "$LEAKS"
            exit 1
          fi
          echo "Bundle clean: no runtime.tar.gz / runtime.json / bundled Node / dsh runtime."

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.artifact }}
          if-no-files-found: error
          path: src-tauri/target/${{ matrix.target }}/release/bundle

  # ---------------------------------------------------------------------
  # 4. publish-release: only after ALL platforms built. Upload assets to the
  #    draft, generate latest.json, verify, then publish (unless dispatch
  #    requested draft mode). Never touches GitHub Latest here.
  # ---------------------------------------------------------------------
  publish-release:
    name: Publish GitHub release
    needs: [resolve-release, prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify asset manifest across platforms
        env:
          EXPECTED_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            const expected = process.env.EXPECTED_VERSION;
            const manifests = execSync('find artifacts -name bundle-manifest.json | sort', { encoding: 'utf8' })
              .trim().split('\n').filter(Boolean);
            if (manifests.length === 0) throw new Error('no bundle-manifest.json found under artifacts/');
            const platforms = new Set();
            const basenames = new Set();
            let total = 0;
            for (const mPath of manifests) {
              const m = JSON.parse(fs.readFileSync(mPath, 'utf8'));
              if (m.version !== expected) throw new Error(mPath + ': version ' + m.version + ' != ' + expected);
              platforms.add(m.platform);
              for (const f of m.files) {
                const p = path.join(path.dirname(mPath), f.artifact);
                if (!fs.existsSync(p)) throw new Error('missing ' + f.artifact);
                const base = path.basename(f.artifact);
                if (basenames.has(base)) throw new Error('duplicate asset basename: ' + base);
                basenames.add(base);
                total += 1;
              }
            }
            const required = ['windows', 'macos', 'linux'];
            for (const platform of required) {
              if (!platforms.has(platform)) throw new Error('missing platform artifacts: ' + platform);
            }
            console.log('asset manifest OK: ' + total + ' unique file(s) for platforms ' + [...platforms].join(', '));
          "

      - name: Upload installers to draft release
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          RELEASE_ID="${{ needs.prepare-release.outputs.release_id }}"
          mapfile -t FILES < <(find artifacts -type f \( \
            -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.app.tar.gz' \
            -o -name '*.sig' \) | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no installers found under artifacts/"
            exit 1
          fi
          node scripts/reconcile-release-state.mjs upload-assets \
            --tag "$TAG" --release-id "$RELEASE_ID" "${FILES[@]}"

      - name: Generate latest.json
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-release.outputs.version }}"
          TAG="${{ needs.resolve-release.outputs.tag }}"
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          if [ "${{ needs.resolve-release.outputs.is_prerelease }}" = "true" ]; then
            CHANNEL=prerelease
          else
            CHANNEL=stable
          fi
          node scripts/update-latest.mjs \
            --from-dir artifacts \
            --version "$VERSION" \
            --tag "$TAG" \
            --notes "$NOTES" \
            --channel "$CHANNEL"

      - name: Validate latest.json update channels
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            const tag = process.env.RELEASE_TAG;
            const required = {
              'windows-x86_64': '-setup.exe',
              'darwin-x86_64': '.app.tar.gz',
              'darwin-aarch64': '.app.tar.gz',
              'linux-x86_64': '.AppImage'
            };
            if (data.version !== tag.slice(1)) {
              throw new Error('latest.json version ' + data.version + ' != ' + tag);
            }
            for (const [key, suffix] of Object.entries(required)) {
              const entry = data.platforms[key];
              if (!entry) throw new Error('missing platform ' + key);
              if (!entry.url.includes('/' + tag + '/')) {
                throw new Error(key + ' url must reference ' + tag + ': ' + entry.url);
              }
              if (!entry.url.endsWith(suffix)) {
                throw new Error(key + ' url must end with ' + suffix + ': ' + entry.url);
              }
              if (!entry.signature || !entry.sha256) {
                throw new Error(key + ' missing signature/sha256');
              }
            }
            console.log('latest.json update channels OK: ' + Object.keys(data.platforms).join(', '));
          "

      - name: Upload latest.json to versioned release
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          if [ "${{ needs.resolve-release.outputs.is_prerelease }}" = "true" ]; then
            # Prereleases must not pollute the stable updater channel; upload a
            # clearly named artifact instead of `latest.json`.
            cp latest.json latest-prerelease.json
            gh release upload "$TAG" latest-prerelease.json --clobber
          else
            gh release upload "$TAG" latest.json --clobber
          fi

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish_mode != 'draft'
        run: |
          set -euo pipefail
          node scripts/reconcile-release-state.mjs publish \
            --tag "${{ needs.resolve-release.outputs.tag }}" \
            --release-id "${{ needs.prepare-release.outputs.release_id }}" \
            --prerelease "${{ needs.resolve-release.outputs.is_prerelease }}"

  # ---------------------------------------------------------------------
  # 5. reconcile-latest: the ONLY job allowed to change GitHub Latest.
  #    Serialized globally so two concurrent stable releases cannot race.
  #    A rerun of an older stable release keeps Latest on the newer one.
  # ---------------------------------------------------------------------
  reconcile-latest:
    name: Reconcile GitHub Latest
    if: needs.resolve-release.outputs.is_prerelease == 'false'
    needs: [resolve-release, publish-release]
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set Latest to highest stable release
        run: |
          set -euo pipefail
          node scripts/reconcile-release-state.mjs set-latest \
            --tag "${{ needs.resolve-release.outputs.tag }}"

  # ---------------------------------------------------------------------
  # 6. publish-updater-channel: the ONLY job that writes the stable `update`
  #    release. Serialized globally (`updater-stable-channel`), recomputes the
  #    highest stable version, and verifies the written latest.json.
  # ---------------------------------------------------------------------
  publish-updater-channel:
    name: Publish stable updater channel
    if: needs.resolve-release.outputs.is_prerelease == 'false'
    needs: [resolve-release, publish-release]
    runs-on: ubuntu-latest
    concurrency:
      group: updater-stable-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate latest.json from highest stable release
        run: node scripts/update-latest.mjs --from-release --channel stable

      - name: Read selected stable version
        id: stable
        run: |
          V=$(node -e "console.log(JSON.parse(require('fs').readFileSync('latest.json', 'utf8')).version)")
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "::notice::stable updater channel will point at v${V}"

      - name: Sync update release
        run: |
          node scripts/reconcile-release-state.mjs sync-updater \
            --tag "${{ steps.stable.outputs.tag }}" \
            --latest-json latest.json \
            --target "$GITHUB_SHA"
