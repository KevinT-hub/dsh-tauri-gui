name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

# CI never writes; publishing is handled by release.yml.
permissions:
  contents: read

# Keep only the newest run per branch/PR; release workflows are separate and
# unaffected by this group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `build` runs `tsc` (type check) then `vite build`.
      - run: pnpm run build
      # Release tooling (semver/version/reconcile/rename/updater) unit tests.
      - run: pnpm run test:scripts

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Rust channel is pinned in src-tauri/rust-toolchain.toml so CI and
      # releases never drift between "stable" snapshots.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Explicit compile-only placeholders (marked testMode) so `cargo check`
      # can run without a real runtime. The release workflow always replaces
      # them with `runtime:package` output and asserts no testMode marker
      # reaches the installers.
      - name: Create compile-only resource placeholders
        run: node scripts/prepare-runtime.mjs --test-resource

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

  runtime-smoke:
    name: Runtime prune + end-to-end smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prepare pruned runtime bundle
        run: node scripts/prepare-runtime.mjs --package --target "$RUNNER_TEMP/dsh-runtime" --keep
        env:
          DSH_TAURI_NPM_REGISTRY: https://registry.npmjs.org

      - name: Smoke test the pruned runtime
        run: node scripts/smoke-runtime.mjs --runtime "$RUNNER_TEMP/dsh-runtime"
        env:
          CI: "true"

      # Directly unpack and verify the final tar.gz the installer ships, so an
      # empty or truncated archive can never slip through.
      - name: Smoke test the packed archive
        run: node scripts/smoke-runtime.mjs --archive "src-tauri/resources/runtime.tar.gz"
        env:
          CI: "true"

  # Dependency audit. Explicitly non-blocking (continue-on-error) so an
  # advisory never blocks a merge by itself; alerts stay visible in logs.
  dependency-audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
