name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:

# CI never publishes releases; the audit job may write only its Check Run.
permissions:
  contents: read

# GitHub-hosted runners run outside mainland China. Keep CI on the official
# upstream endpoints; the shell's runtime detection is entirely local.
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org

# Keep only the newest run per branch/PR; release workflows are separate and
# unaffected by this group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      # `build` runs `tsc` (type check) then `vite build`.
      - run: pnpm run build
      # Release tooling (semver/version/reconcile/rename/updater) unit tests.
      - run: pnpm run test:scripts

  rust:
    name: Rust checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Rust channel is pinned in src-tauri/rust-toolchain.toml so CI and
      # releases never drift between "stable" snapshots.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
          pnpm run build

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      # Unit tests cover: environment detection gates, version parsing,
      # Windows command-extension resolution, geo country-code normalization,
      # geo consensus/cache and source selection (all fixture-driven, no
      # real PATH / dsh home / network dependency).
      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

  # Dependency audit. Explicitly non-blocking (continue-on-error) so an
  # advisory never blocks a merge by itself; alerts stay visible in logs.
  dependency-audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-22.04
    continue-on-error: true
    # rustsec/audit-check publishes its advisory summary as a Check Run.
    # Keep this permission scoped to the non-blocking audit job; fork PRs are
    # still handled by the action's read-only fallback.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
